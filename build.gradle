plugins {
    id 'com.android.application'
}

android {
    namespace 'id.kimpul.tweaks'
    compileSdk 35

    defaultConfig {
        applicationId 'id.kimpul.tweaks'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '2.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
}
